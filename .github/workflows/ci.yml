name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Title matching and manifest tests
        run: node --test test/keys.test.js test/manifest.test.js

      - name: Firefox add-on lint (fails on warnings too)
        run: npx --yes web-ext@8 lint --source-dir src --warnings-as-errors

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser tests (extension loaded in Chromium)
        env:
          CHROME_PATH: ""  # use Playwright's Chromium
        run: |
          python test/browser_test.py
          SERVER=1 python test/import_test.py
          SERVER=0 python test/import_test.py

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version" >&2
            exit 1
          fi

      - name: Build the store package
        run: |
          cd src
          zip -r "../srg-owned-${GITHUB_REF_NAME#v}.zip" . -x '.*'

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" srg-owned-*.zip --title "SRG Owned ${GITHUB_REF_NAME#v}" --generate-notes
